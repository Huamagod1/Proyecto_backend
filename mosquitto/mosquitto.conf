# mosquitto.conf · configuración del broker MQTT (Fase 6).
# Se monta en /mosquitto/config/ del contenedor eclipse-mosquitto:2.1-alpine.
# Usuarios en `passwd` (lo genera src/scripts/claves-mqtt.sh) y permisos en `acl`.

# Mosquitto 2 no escucha nada si no se declara un listener: puerto 1883, MQTT sin TLS.
listener 1883

# SEGURIDAD: sin usuario y clave no se conecta nadie (en el paso 1 del plan estaba en true).
allow_anonymous false

# Autenticación: el plugin lee los usuarios y sus hashes desde passwd. Cada plugin_opt_ aplica al
# plugin declarado justo antes.
# POR QUÉ plugins: en Mosquitto 2.1 las opciones password_file y acl_file siguen funcionando, pero
# están obsoletas y desaparecen en la 3.0.
plugin /usr/lib/mosquitto_password_file.so
plugin_opt_password_file /mosquitto/config/passwd

# Autorización: qué tópicos puede leer o escribir cada usuario (ver el archivo acl).
plugin /usr/lib/mosquitto_acl_file.so
plugin_opt_acl_file /mosquitto/config/acl

# Persistencia: guarda en disco las sesiones persistentes y los mensajes QoS 1 pendientes.
# POR QUÉ: si el broker se reinicia, la API no pierde lo que el broker tenía guardado para ella.
persistence true
persistence_location /mosquitto/data/

# Mensajes QoS 1 que el broker guarda por cliente desconectado. El valor por defecto es 1000: con
# la API caída unos minutos y varios gateways, se perderían. 100 000 mensajes de ~200 bytes son ~20 MB.
max_queued_messages 100000

# Logs a la salida estándar: los muestra `docker compose logs mosquitto`.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
