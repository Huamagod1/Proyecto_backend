# docker-compose.yml · todo el sistema en contenedores (fases 2, 6, 10 y 12).
# Base, sin perfil: MySQL y Mosquitto → docker compose up -d --wait
# Perfil "completo" (Fase 12): + API, gateway y simulador → docker compose --profile completo up -d --build
# Perfil "nodered" (Fase 10): + simulador y Node-RED → docker compose --profile nodered up -d
# Compose lee las ${VARIABLES} de tu .env (misma carpeta): las claves no quedan escritas aquí.
# Dentro de Docker, cada servicio se llama por su nombre (mysql, mosquitto, simulador), no por 127.0.0.1.

# POR QUÉ: nombre fijo del proyecto para contenedores y volúmenes (telemetria-mysql-1,
# telemetria_datos-mysql). Sin esta línea, Compose usaría el nombre de la carpeta.
name: telemetria

# x-app: bloque reutilizable ("extension field"); <<: *app lo copia en cada servicio que lo nombra.
# POR QUÉ: la API, el gateway y el simulador comparten una sola imagen y solo cambian el comando.
x-app: &app
  build: .                                            # construye con el Dockerfile de esta carpeta
  image: telemetria-app:latest                        # nombre de la imagen construida (la reutilizan los tres)
  restart: unless-stopped                             # vuelve solo si se cae o al reiniciar Docker

services:
  mysql:
    image: mysql:8.4                                  # versión fija (LTS, soporte hasta 2029): la misma en todos los equipos
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}     # SEGURIDAD: sale de .env, nunca del repositorio
      MYSQL_DATABASE: telemetria                      # crea la base vacía la primera vez
      DB_CLAVE: ${DB_CLAVE}                           # la lee sql/003_usuario_app.sh para crear telemetria_app
      TZ: UTC                                         # POR QUÉ: horas del contenedor sin saltos por cambio de horario
      LANG: C.UTF-8                                   # OJO: sin esto, el cliente mysql del contenedor usa latin1 y "°C" se ve "�C"
    command:
      - --default-time-zone=+00:00                    # las sesiones de MySQL también en UTC: NOW() devuelve UTC
      - --slow-query-log=ON                           # Fase 11: anota las consultas lentas en /var/lib/mysql/<host>-slow.log
      - --long-query-time=1                           # "lenta" = más de 1 s
    ports:
      - "3306:3306"                                   # host:contenedor; si choca con otro MySQL, usa "3307:3306"
    volumes:
      - datos-mysql:/var/lib/mysql                    # volumen con nombre: los datos sobreviven aunque se borre el contenedor
      - ./sql:/docker-entrypoint-initdb.d:ro          # OJO: estos scripts corren solo al crear la base (volumen vacío)
    healthcheck:
      # mysqladmin ping por TCP (127.0.0.1): durante la inicialización MySQL solo escucha por socket,
      # así que el servicio queda "healthy" recién cuando los scripts de sql/ terminaron.
      # $$ escapa el $ para Compose: la variable la expande el shell dentro del contenedor.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s                                    # cada cuánto se prueba
      timeout: 3s                                     # cuánto espera cada prueba
      retries: 20                                     # 20 fallos seguidos → unhealthy
      start_period: 60s                               # gracia inicial: crear la base toma de 20 a 60 s
    restart: unless-stopped                           # vuelve solo al reiniciar Docker, salvo que lo detengas tú

  mosquitto:
    image: eclipse-mosquitto:2.1-alpine               # broker MQTT 2.1.x; OJO: la 2.1 solo se publica con sufijo -alpine
    ports:
      - "1883:1883"                                   # MQTT sin TLS, para el gateway y la API en tu equipo
    volumes:
      # Configuración: mosquitto.conf, acl y passwd. Sin :ro porque claves-mqtt.sh escribe el passwd.
      - ./mosquitto:/mosquitto/config
      - datos-mosquitto:/mosquitto/data               # persistencia: sesiones y mensajes QoS 1 pendientes
    restart: unless-stopped

  # Simulador Modbus TCP (fases 10 y 12): la misma imagen del proyecto con otro comando.
  simulador:
    <<: *app
    profiles: ["completo", "nodered"]                 # lo usan el gateway en contenedor y Node-RED
    command: ["node", "src/simulador/motor-modbus.js"]
    environment:
      SIMULADOR_HOST: 0.0.0.0                         # escucha en la red del contenedor, no solo en su localhost
    ports:
      - "127.0.0.1:5020:5020"                         # SEGURIDAD: solo desde tu equipo (para el gateway de `npm run gateway`)

  api:
    <<: *app
    profiles: ["completo"]
    # SEGURIDAD: solo las variables que la API usa, y no todo el .env (por ejemplo, sin la clave de root).
    environment:
      PUERTO: 3000
      DB_HOST: mysql                                  # el nombre del servicio, resuelto por la red de Compose
      DB_PUERTO: 3306
      DB_USUARIO: ${DB_USUARIO}
      DB_CLAVE: ${DB_CLAVE}
      DB_NOMBRE: ${DB_NOMBRE}
      JWT_SECRETO: ${JWT_SECRETO}
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USUARIO: ${MQTT_USUARIO}
      MQTT_CLAVE: ${MQTT_CLAVE}
    ports:
      - "3000:3000"                                   # API y dashboard en http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy                    # no arranca hasta que MySQL termine de inicializarse
      mosquitto:
        # OJO: la imagen de Mosquitto 2.1 no trae healthcheck; basta con que haya arrancado,
        # porque los clientes MQTT se reconectan solos cada 2 s.
        condition: service_started
    healthcheck:
      # La imagen slim no trae curl: se usa el fetch de Node. Código de salida 0 = sana.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/salud').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  gateway:
    <<: *app
    profiles: ["completo"]
    command: ["node", "src/gateway/gateway.js"]
    environment:
      MODBUS_HOST: simulador
      MODBUS_PUERTO: 5020
      GATEWAY_ID: ${GATEWAY_ID}
      GATEWAY_SITIO: ${GATEWAY_SITIO}
      GATEWAY_EQUIPOS: ${GATEWAY_EQUIPOS}             # con Node-RED activo, 1:MTR-01 (Node-RED lee MTR-02)
      GATEWAY_BUFFER: /app/datos/buffer.sqlite        # dentro del volumen: el buffer sobrevive a recrear el contenedor
      GATEWAY_PERIODO_MS: ${GATEWAY_PERIODO_MS}
      MQTT_URL: mqtt://mosquitto:1883
      GATEWAY_MQTT_USUARIO: ${GATEWAY_MQTT_USUARIO}
      GATEWAY_MQTT_CLAVE: ${GATEWAY_MQTT_CLAVE}
    volumes:
      - datos-gateway:/app/datos                      # POR QUÉ: store-and-forward en disco, no en la capa del contenedor
    depends_on:
      simulador:
        condition: service_started
      mosquitto:
        # OJO: la imagen de Mosquitto 2.1 no trae healthcheck; basta con que haya arrancado,
        # porque los clientes MQTT se reconectan solos cada 2 s.
        condition: service_started

  nodered:
    image: nodered/node-red:5.0                       # Node-RED 5.0 con Node 24; node-red-contrib-modbus exige Node 22 o superior
    profiles: ["nodered"]
    environment:
      TZ: UTC                                         # horas del contenedor sin saltos de horario
    # Las credenciales MQTT del flujo NO van aquí: las inyecta src/scripts/desplegar-nodered.js al
    # desplegar, y Node-RED las guarda cifradas en /data (flows_cred.json).
    # OJO: Node-RED no reemplaza ${VARIABLES} dentro de las credenciales, solo en las demás propiedades.
    ports:
      # SEGURIDAD: solo desde tu equipo. El editor no tiene contraseña y un nodo function ejecuta
      # código: abierto a la red, cualquiera podría correr programas en el contenedor.
      - "127.0.0.1:1880:1880"
    volumes:
      - datos-nodered:/data                           # flujos, nodos instalados (node-red-contrib-modbus) y configuración
    depends_on:
      - simulador
      - mosquitto
    restart: unless-stopped

volumes:
  datos-mysql:                                        # Compose lo crea como telemetria_datos-mysql
  datos-mosquitto:                                    # sobrevive a reinicios y a docker compose down (sin -v)
  datos-nodered:                                      # el /data de Node-RED (Fase 10)
  datos-gateway:                                      # el buffer SQLite del gateway en contenedor (Fase 12)
