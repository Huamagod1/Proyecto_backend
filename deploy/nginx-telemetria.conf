# nginx-telemetria.conf · nginx como única entrada a la API y al dashboard (Fase 13).
# Se copia a /etc/nginx/sites-available/telemetria y se enlaza en sites-enabled:
#   sudo ln -s /etc/nginx/sites-available/telemetria /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx      # SIEMPRE probar antes de recargar
# La API escucha solo en 127.0.0.1:3000; desde afuera se entra por el puerto 80 (o 443 con TLS).
# En /etc/telemetria/api.env va CONFIAR_PROXY=1, para que la API lea la IP real del cliente.

# Grupo de servidores de la API. keepalive: conexiones abiertas y reutilizadas hacia node.
upstream telemetria_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    # Puerto 80 en IPv4 e IPv6. Con un dominio, el siguiente paso es TLS con certbot (puerto 443).
    listen 80;
    listen [::]:80;
    # _ = cualquier nombre de host (no hay dominio en el laboratorio).
    server_name _;

    # Mismo tope que express.json({ limit: '1mb' }): nginx corta antes de molestar a node.
    client_max_body_size 1m;

    # SEGURIDAD: no anuncia la versión de nginx (encabezado Server y páginas de error); sin esto,
    # un atacante sabe qué vulnerabilidades buscar.
    server_tokens off;

    # WebSocket del dashboard (Fase 9).
    location /ws {
        proxy_pass http://telemetria_api;
        # OJO: WebSocket necesita HTTP/1.1 y estos dos encabezados; sin ellos, nginx entrega un GET
        # normal y la API responde 404 en vez de cambiar de protocolo.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Por defecto nginx corta a los 60 s sin tráfico; el ping de la API es cada 30 s: 75 s de margen.
        proxy_read_timeout 75s;
        # SEGURIDAD: la URL lleva el token (?token=...); no se anota en el log de accesos.
        access_log off;
    }

    # API REST y archivos del dashboard.
    location / {
        proxy_pass http://telemetria_api;
        proxy_http_version 1.1;
        # Connection vacío: permite reutilizar la conexión con el upstream (keepalive).
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # X-Forwarded-For agrega la IP del cliente a la cadena; Express la lee con 'trust proxy'.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
